name: Fork CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "patches/**"
      - "scripts/**"
      - "hub/**"
      - "external_plugins/telegram/**"
      - ".claude-plugin/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Verify patch packages and the patched tree
        run: scripts/verify
