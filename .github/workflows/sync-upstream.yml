name: Sync patched fork

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional exact upstream commit SHA
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UPSTREAM: anthropics/claude-plugins-official
  SOURCE_OVERRIDE: ${{ inputs.source_sha || '' }}
  CONTROL_FILES: .github patches scripts/fork_sync.py scripts/test_fork_sync.py scripts/verify

concurrency:
  group: patched-fork-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout fork main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve one upstream source commit
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch --no-tags upstream main:refs/remotes/upstream/main
          if [ -n "$SOURCE_OVERRIDE" ]; then
            source_sha="$(git rev-parse "${SOURCE_OVERRIDE}^{commit}")"
            git merge-base --is-ancestor "$source_sha" refs/remotes/upstream/main
          else
            source_sha="$(git rev-parse 'refs/remotes/upstream/main^{commit}')"
          fi

          # Sync commits merge the source as a second parent, so ancestry is
          # the tree truth; patch metadata alone can't mark a source synced.
          if git merge-base --is-ancestor "$source_sha" HEAD; then
            source_synced=true
          else
            source_synced=false
          fi
          {
            echo "source_sha=$source_sha"
            echo "current_main=$(git rev-parse HEAD)"
            echo "source_synced=$source_synced"
          } >> "$GITHUB_OUTPUT"

      - name: Restore control plane and try deterministic patches
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          current_main='${{ steps.resolve.outputs.current_main }}'
          source_sha='${{ steps.resolve.outputs.source_sha }}'
          git checkout --detach "$source_sha"
          # .github is fork-owned: upstream workflow files can't be pushed with
          # the default Actions token, and a repo holding a Claude token must
          # not run newly imported upstream automation. Surface what this
          # excludes so upstream automation changes are never silent.
          last_sync="$(git rev-list --min-parents=2 --first-parent -n 1 "$current_main")"
          last_source="$(git merge-base "$current_main" "$source_sha")"
          [ -n "$last_sync" ] && last_source="${last_sync}^2"
          if ! git diff --quiet "$last_source" "$source_sha" -- .github; then
            git diff "$last_source" "$source_sha" -- .github > "$RUNNER_TEMP/upstream-github.diff"
            echo "::warning title=upstream .github changed::.github is fork-owned; review the upstream-github-diff artifact for excluded upstream automation changes"
          fi
          git rm -r -q --ignore-unmatch .github
          git checkout "$current_main" -- $CONTROL_FILES

          python3 scripts/fork_sync.py validate
          apply_failed=false
          while IFS= read -r patch; do
            if ! git apply --check --verbose "$patch"; then
              apply_failed=true
            fi
          done < <(python3 scripts/fork_sync.py list-patches)

          if [ "$apply_failed" = "false" ]; then
            while IFS= read -r patch; do
              git apply --index "$patch"
            done < <(python3 scripts/fork_sync.py list-patches)
          fi
          echo "apply_failed=$apply_failed" >> "$GITHUB_OUTPUT"

      - name: Upload upstream .github drift
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upstream-github-diff
          path: ${{ runner.temp }}/upstream-github.diff
          if-no-files-found: ignore

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Heal patches with Claude only after git apply fails
        if: steps.apply.outputs.apply_failed == 'true'
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          npm install --global @anthropic-ai/claude-code@2.1.289
          claude -p \
            --model claude-opus-5-5 \
            --effort high \
            --dangerously-skip-permissions <<'PROMPT'
          The deterministic patches failed against the checked-out upstream
          claude-plugins-official source. Read every patches/*/PATCH.md and
          implement those intents completely. Preserve upstream behavior outside
          those intents. Do not modify .github, scripts/fork_sync.py,
          scripts/test_fork_sync.py, scripts/verify, or anything under patches/.
          Run scripts/verify and leave the working tree with the healed source
          implementation.
          PROMPT
          # A clean exit doesn't prove a heal, so require actual source changes.
          if git diff --quiet && git diff --cached --quiet -- \
            ':(exclude).github' ':(exclude)patches' ':(exclude)scripts/fork_sync.py' \
            ':(exclude)scripts/test_fork_sync.py' ':(exclude)scripts/verify'; then
            echo "claude exited cleanly but changed no source files" >&2
            exit 1
          fi

      - name: Restore trusted control files after healing
        if: steps.apply.outputs.apply_failed == 'true'
        shell: bash
        run: |
          rm -rf .github
          git checkout '${{ steps.resolve.outputs.current_main }}' -- $CONTROL_FILES

      - name: Warn when heal exceeds claimed patch paths
        if: steps.apply.outputs.apply_failed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if ! python3 scripts/fork_sync.py verify-changed-paths \
            --source-sha '${{ steps.resolve.outputs.source_sha }}'; then
            git diff --binary '${{ steps.resolve.outputs.source_sha }}' -- \
              ':(exclude).github' ':(exclude)patches' ':(exclude)scripts/fork_sync.py' \
              ':(exclude)scripts/test_fork_sync.py' ':(exclude)scripts/verify' \
              > "$RUNNER_TEMP/healed.diff"
            echo "::warning title=heal exceeded claimed patch paths::refresh sweeps the extra paths into patches/heal-overflow; review the healed-diff artifact and reassign them to named patches"
          fi

      - name: Upload healed diff for maintainer adoption
        if: always() && steps.apply.outputs.apply_failed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: healed-diff
          path: ${{ runner.temp }}/healed.diff
          if-no-files-found: ignore

      - name: Update plugin dependencies within their ranges
        shell: bash
        run: |
          set -euo pipefail
          for plugin in telegram discord; do
            (cd "external_plugins/$plugin" && bun update && git checkout -- package.json && bun install)
          done

      - name: Verify rebuilt source
        run: scripts/verify

      - name: Refresh deterministic patch artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          python3 scripts/fork_sync.py refresh \
            --source-sha '${{ steps.resolve.outputs.source_sha }}'
          git add -A
          git diff --cached --check -- . ':(exclude)patches/**/*.patch'

      - name: Commit verified tree to main as a signed commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main='${{ steps.resolve.outputs.current_main }}'
          source_sha='${{ steps.resolve.outputs.source_sha }}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tree="$(git write-tree)"
          if [ "$tree" = "$(git rev-parse "${current_main}^{tree}")" ]; then
            echo "main is current"
            exit 0
          fi
          if [ '${{ steps.resolve.outputs.source_synced }}' = "true" ]; then
            message="chore: update plugin dependencies"
            commit_parents=(-p "$current_main")
            api_parents=(-f "parents[]=$current_main")
          else
            message="chore: sync patched fork to ${source_sha}"
            commit_parents=(-p "$current_main" -p "$source_sha")
            api_parents=(-f "parents[]=$current_main" -f "parents[]=$source_sha")
          fi
          if [ '${{ steps.apply.outputs.apply_failed }}' = "true" ]; then
            message="${message}"$'\n\n'"patches healed by Claude after deterministic apply failed"
          fi
          # Push the objects under a scratch ref, then have GitHub create the
          # commit itself: commits made through the API are signed by GitHub.
          carrier="$(printf 'carrier\n' | git commit-tree "$tree" "${commit_parents[@]}")"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          scratch="refs/heads/sync-objects-${GITHUB_RUN_ID}"
          git push "$remote" "${carrier}:${scratch}"
          trap 'git push "$remote" --delete "$scratch" || true' EXIT
          signed="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits" \
            -f message="$message" -f tree="$tree" \
            "${api_parents[@]}" --jq .sha)"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/main" -f sha="$signed" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/commits/${signed}" \
            --jq '"synced \(.sha[0:12]), verified: \(.commit.verification.verified)"'
